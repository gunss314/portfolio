    <rect x="0" y="12" width="6" height="24" rx="3"/><rect x="12" y="4" width="6" height="40" rx="3"/>
    <rect x="24" y="16" width="6" height="16" rx="3"/><rect x="36" y="0" width="6" height="48" rx="3"/>
    <rect x="48" y="10" width="6" height="28" rx="3"/><rect x="60" y="18" width="6" height="12" rx="3"/>
    <rect x="72" y="6" width="6" height="36" rx="3"/><rect x="84" y="14" width="6" height="20" rx="3"/>
  </g>
  <g font-weight="800">
