<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Sora, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="vb3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c0f33"/>
      <stop offset="0.55" stop-color="#0a0c1b"/>
      <stop offset="1" stop-color="#001f2e"/>
    </linearGradient>
    <linearGradient id="acc3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e0c6"/>
      <stop offset="1" stop-color="#8f7bff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#vb3)"/>
  <!-- long-form player mock -->
  <g transform="translate(90,90)">
    <rect x="0" y="0" width="420" height="240" rx="16" fill="#0d0f22" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <rect x="18" y="18" width="384" height="160" rx="10" fill="url(#acc3)" opacity="0.8"/>
    <path d="M192 78 l44 30 l-44 30z" fill="#0a0c1b" opacity="0.92"/>
