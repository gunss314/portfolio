    <rect x="18" y="196" width="150" height="8" rx="4" fill="#00e0c6"/>
    <circle cx="210" cy="200" r="7" fill="#ffffff"/>
    <rect x="18" y="214" width="120" height="12" rx="6" fill="#ffffff" opacity="0.25"/>
  </g>
  <!-- subtitles block -->
  <g transform="translate(560,150)">
